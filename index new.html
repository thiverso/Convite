<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quanto Você Conhece o Thi?</title>
<meta name="description" content="Quanto você conhece o Thi? Faça o quiz do Thi Universe.">
<style>*,*::before,*::after{box-sizing:border-box}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Outfit:wght@200;300;500;600&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: Thi Universe. Céu com galáxia em canvas fixo atrás de tudo; abertura com o logo; depois cartões de vidro azul-marinho com dourado */
:root{
  --space:#000207; --glass:rgba(10,18,52,.62); --glass-2:rgba(4,9,30,.55); --line:rgba(150,180,255,.2);
  --ink:#eef3ff; --muted:#9fb0dc; --gold:#ffd66b; --gold-2:#ffb938; --blue:#5f9bff;
  --c1:#5f9bff; --c2:#9b8cff; --c3:#4fd6c8; --c4:#ffd66b;
  --ok:#4ee39a; --bad:#ff6b7d;
  --display:"Outfit","Helvetica Neue",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{background:var(--space)}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-weight:600;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
body.intro{overflow:hidden}
#space{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
/* abertura */
.intro-ui{position:fixed;left:0;right:0;bottom:calc(15% + env(safe-area-inset-bottom,0px));z-index:10;display:flex;justify-content:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.intro-btn{font-family:"Unbounded",var(--display);font-weight:800;font-size:.95rem;letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,214,107,.6);border-radius:99px;padding:15px 28px;
  background:rgba(255,214,107,.1);color:var(--gold);cursor:pointer;box-shadow:0 0 30px rgba(255,214,107,.2),inset 0 0 20px rgba(255,214,107,.08);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;transform:translateY(10px);transition:opacity .8s,transform .8s,background .2s,box-shadow .2s;pointer-events:none}
.intro-btn.show{opacity:1;transform:none;pointer-events:auto}
@media (hover:hover){.intro-btn:hover{background:rgba(255,214,107,.2);box-shadow:0 0 44px rgba(255,214,107,.45)}}
/* conteúdo */
.wrap{position:relative;z-index:2;max-width:540px;margin:0 auto;display:flex;flex-direction:column;gap:20px;opacity:0;transform:translateY(16px);transition:opacity .5s .15s,transform .5s .15s}
.wrap.on{opacity:1;transform:none}
h1,h2{font-family:var(--display);font-weight:500;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
header{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-block:8px 4px}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1}
.bw{font-family:var(--display);font-weight:300;font-size:3rem;letter-spacing:.01em;line-height:1;padding-top:.2em;
  background:linear-gradient(100deg,#ffd66b 0%,#fff4cc 18%,#ffd66b 30%,#c08020 52%,#ffcf5a 68%,#fff1b8 82%,#ffd66b 100%);background-size:250% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(255,190,60,.45));animation:shimmer 5s linear infinite}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-150% 0}}
.ii{position:relative;display:inline-block}
.istar{position:absolute;left:50%;bottom:.74em;width:.3em;height:.3em;transform:translateX(-50%);fill:#ffe49a;overflow:visible;animation:twinkle 2.8s ease-in-out infinite}
@keyframes twinkle{0%,100%{filter:drop-shadow(0 0 2px rgba(255,200,80,.6));transform:translateX(-50%) scale(1)}50%{filter:drop-shadow(0 0 6px #fff3c4) drop-shadow(0 0 16px rgba(255,190,60,.95));transform:translateX(-50%) scale(1.35)}}
.hlogo{display:block;width:150px;height:71px;max-width:100%}
.uv{display:flex;align-items:center;gap:10px;margin-top:2px}
.uv b{font-family:var(--display);font-weight:300;font-size:.78rem;letter-spacing:.55em;padding-left:.55em;color:#e6efff;text-shadow:0 0 10px rgba(80,150,255,.85)}
.uv i{position:relative;display:block;width:34px;height:1px}
.uv i:first-child{background:linear-gradient(90deg,rgba(255,214,107,0),rgba(255,214,107,.9))}
.uv i:last-child{background:linear-gradient(90deg,rgba(255,214,107,.9),rgba(255,214,107,0))}
.uv i::after{content:"";position:absolute;top:50%;width:7px;height:7px;transform:translate(-50%,-50%) rotate(45deg);background:#ffe49a;box-shadow:0 0 6px rgba(255,200,80,.9);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%)}
.uv i:first-child::after{left:100%}
.uv i:last-child::after{left:0}
h1{font-size:clamp(1.9rem,8vw,2.7rem);font-weight:300}
h1 b{font-weight:600;color:var(--gold)}
.card{background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;padding:24px;display:flex;flex-direction:column;gap:18px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.lead{font-size:1.05rem}
label{font-weight:900}
input[type=text]{font:inherit;font-weight:800;font-size:1.1rem;padding:15px 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);width:100%;box-sizing:border-box}
input[type=text]::placeholder{color:#6878a8}
input[type=text]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,214,107,.22)}
.btn{font-family:var(--display);font-weight:600;font-size:1.15rem;border:0;border-radius:14px;padding:15px 20px;background:linear-gradient(180deg,#ffe49a,var(--gold) 50%,var(--gold-2));color:#1b1430;cursor:pointer;box-shadow:0 0 0 1px rgba(255,214,107,.4),0 8px 28px rgba(255,190,60,.28);transition:transform .1s,box-shadow .2s}
@media (hover:hover){.btn:hover{box-shadow:0 0 0 1px rgba(255,214,107,.6),0 10px 38px rgba(255,190,60,.5)}}
.btn:active{transform:scale(.97)}
.btn.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn:focus-visible,.opt:focus-visible,.intro-btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.pill{font-weight:900;font-size:.8rem;padding:5px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.pill.streak{color:#ffb27a;border-color:rgba(255,178,122,.5)}
.pill.pts{color:var(--gold);border-color:rgba(255,214,107,.5)}
.bar{height:6px;border-radius:99px;background:rgba(150,180,255,.15);overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));box-shadow:0 0 12px var(--gold);transition:width .5s cubic-bezier(.3,1.4,.5,1)}
#q{font-size:clamp(1.45rem,6.2vw,1.9rem)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{--c:var(--c1);font:inherit;font-weight:800;font-size:1.02rem;text-align:left;padding:14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:color-mix(in srgb,var(--c) 12%,rgba(4,9,30,.5));color:var(--ink);cursor:pointer;display:flex;align-items:center;gap:12px;transition:transform .12s,box-shadow .2s,opacity .25s,background .2s;min-width:0}
.opt .k{flex:none;width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:var(--c);color:#0b1030;font-family:var(--display);font-weight:600}
.opt span.t{min-width:0;overflow-wrap:anywhere}
.opt:nth-child(2){--c:var(--c2)} .opt:nth-child(3){--c:var(--c3)} .opt:nth-child(4){--c:var(--c4)}
@media (hover:hover){.opt:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}}
.opt:not(:disabled):active{transform:scale(.98)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.3}
.opt.right{--c:var(--ok);background:color-mix(in srgb,var(--ok) 25%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--ok) 50%,transparent);animation:pop .45s cubic-bezier(.3,1.8,.5,1)}
.opt.wrong{--c:var(--bad);background:color-mix(in srgb,var(--bad) 22%,transparent);animation:shake .45s}
@keyframes pop{40%{transform:scale(1.05)}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.fact{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:16px;background:var(--glass-2);border:1px solid var(--line);font-weight:800;animation:pop .4s}
.fact .big{font-family:var(--display);font-weight:600;font-size:1.1rem;flex:none}
.fact.ok .big{color:var(--ok)} .fact.no .big{color:var(--bad)}
.plus{position:absolute;font-family:var(--display);font-weight:600;font-size:1.6rem;color:var(--gold);text-shadow:0 0 14px var(--gold);pointer-events:none;animation:up .9s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.result{align-items:center;text-align:center}
.medal{font-size:3.4rem;line-height:1;filter:drop-shadow(0 0 18px rgba(255,214,107,.5))}
.score{font-family:var(--display);font-weight:300;font-size:5.4rem;line-height:.9;color:var(--gold);text-shadow:0 0 30px rgba(255,214,107,.5);font-variant-numeric:tabular-nums}
.score small{font-size:2rem;color:var(--muted);text-shadow:none}
#verdict{font-size:1.7rem}
.review{list-style:none;padding:0;margin:0;display:grid;gap:8px;width:100%;text-align:left}
.review li{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);font-size:.95rem}
.review .ic{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#0b1030;font-weight:900;font-size:.8rem}
.review li.ok .ic{background:var(--ok)} .review li.no .ic{background:var(--bad)}
.review .tx{min-width:0;display:flex;flex-direction:column}
.review .tx small{color:var(--muted);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;width:100%}
.row .btn{flex:1 1 180px}
.tag{display:inline-block;color:var(--gold);font-weight:900;font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;padding:5px 12px;border-radius:99px;border:1px solid rgba(255,214,107,.45);background:rgba(255,214,107,.08)}
.rank-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rank h2{font-size:1.6rem}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:8px}
.podium .slot{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.podium .who{font-weight:900;font-size:.9rem;text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .pp{font-weight:800;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.podium .step{width:100%;border-radius:12px 12px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.5rem;color:#0b1030}
.podium .g .step{height:96px;background:linear-gradient(180deg,#ffe8a3,var(--gold));box-shadow:0 0 30px rgba(255,214,107,.4)}
.podium .s .step{height:68px;background:linear-gradient(180deg,#e6ebff,#a9b6e8)}
.podium .b .step{height:50px;background:linear-gradient(180deg,#ffc9a0,#e08b56)}
.podium-base{height:2px;background:var(--line);border-radius:2px}
.rank ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rank li{display:grid;grid-template-columns:2.4rem 1fr auto;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2)}
.rank li.me{border-color:var(--gold)}
.rank .pos{font-family:var(--display);font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .nm{font-weight:900;min-width:0;overflow-wrap:anywhere}
.rank .pt{font-family:var(--display);font-weight:600;color:var(--gold);font-variant-numeric:tabular-nums}
.muted{color:var(--muted);font-weight:700}
.skip{font:inherit;font-weight:800;font-size:.85rem;align-self:center;background:none;border:1px dashed rgba(255,214,107,.5);color:var(--gold);border-radius:99px;padding:8px 14px;cursor:pointer}
.skip:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sharebox{width:100%;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:6px;border-top:1px solid var(--line)}
.share-title{font-family:var(--display);font-weight:500;font-size:1.25rem;padding-top:14px}
.card-img{display:block;width:min(260px,100%);aspect-ratio:9/16;max-width:100%;border-radius:18px;border:1px solid var(--line);box-shadow:0 18px 50px rgba(0,0,0,.55),0 0 40px rgba(255,190,60,.12);background:#050a24;-webkit-touch-callout:default}
.tip{font-size:.88rem;text-align:center}
.tip a{color:var(--gold)}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.sbtn{font:inherit;font-weight:900;font-size:.98rem;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px 10px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);cursor:pointer;text-decoration:none;text-align:center}
.sbtn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.sbtn.save{width:100%;background:linear-gradient(180deg,#14708a,#0b4f63);color:#fff;border:1px solid rgba(120,210,235,.35);box-shadow:0 8px 24px rgba(11,79,99,.45);font-size:1.05rem}
.sbtn.ig{background:linear-gradient(45deg,#f9a03f,#e1306c 50%,#833ab4);color:#fff;border:0}
.sbtn.wa{background:#1faa55;color:#fff;border:0}
.sound{position:fixed;z-index:12;top:calc(12px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--gold);font-size:1.2rem;cursor:pointer;display:grid;place-items:center}
.sound:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.foot{text-align:center;font-size:.85rem;color:var(--muted);font-weight:800}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>


<canvas id="space" aria-hidden="true"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<div class="intro-ui" id="introUi">
  <button class="intro-btn" id="enter">Entrar no universo</button>
</div>

<button class="sound" id="sound" hidden aria-label="Desligar som">🔊</button>

<div class="wrap" id="wrap">
  <header>
    <div class="brand"><canvas class="hlogo" id="hlogo" role="img" aria-label="Thi Universe"></canvas><span class="uv" aria-hidden="true"><i></i><b>UNIVERSE</b><i></i></span></div>
    <h1>Quanto você conhece o <b>Thi?</b></h1>
  </header>

  <section class="card" id="start">
    <label for="nome">Qual é o seu nome?</label>
    <input type="text" id="nome" placeholder="Ex.: Ana" autocomplete="off" maxlength="30">
    <button class="btn" id="go">Começar</button>
  </section>

  <section class="card" id="quiz" hidden style="position:relative">
    <div class="hud">
      <span class="pill" id="count"></span>
      <span class="pill streak" id="streak" hidden></span>
      <span class="pill pts" id="ptsPill">0 pontos</span>
    </div>
    <div class="bar"><b id="barFill" style="width:0"></b></div>
    <h2 id="q"></h2>
    <div class="opts" id="opts"></div>
    <div class="fact" id="fact" hidden><span class="big" id="factBig"></span><span id="factTx"></span></div>
    <button class="btn alt" id="next" hidden>Próxima</button>
  </section>

  <section class="card result" id="end" hidden>
    <span class="tag" id="who"></span>
    <div class="medal" id="medal"></div>
    <div class="score" id="score"></div>
    <h2 id="verdict"></h2>
    <p class="lead" id="verdictText"></p>
    <ul class="review" id="review"></ul>
    <p class="muted" id="saveNote" hidden></p>
    <div class="sharebox">
      <p class="share-title">Compartilhe seu resultado</p>
      <img id="cardImg" class="card-img" alt="Card com o seu resultado no quiz">
      <p class="muted tip" id="saveTip" hidden></p>
      <button class="sbtn save" id="sSave">Salvar</button>
      <div class="share-row">
        <a class="sbtn ig" id="sIg" href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
        <a class="sbtn wa" id="sWa" href="https://wa.me/" target="_blank" rel="noopener">WhatsApp</a>
      </div>
      <p class="muted tip" id="igTip" hidden></p>
    </div>
    <div class="row"><button class="btn alt" id="seeRank" hidden>Ver ranking</button></div>
  </section>

  <section class="card rank" id="rank" hidden>
    <div class="rank-head"><h2>Ranking</h2><span class="tag">Quem me conhece</span></div>
    <div id="podiumWrap" hidden>
      <div class="podium" id="podium"></div>
      <div class="podium-base"></div>
    </div>
    <ol id="rankList"></ol>
    <p class="muted" id="rankEmpty">Ninguém jogou ainda. Faz o quiz e garante o primeiro lugar.</p>
    <p class="muted" id="rankNote" hidden></p>
  </section>

</div>

<script>
/* planetinhas que giram no anel do logo */
const ORBIT=[
  // mesma velocidade e um quarto de volta de distância entre eles: nunca se encontram
  {t:"terra",a0:0,sp:.3,rs:1.0,sz:1.15},
  {t:"marte",a0:Math.PI/2,sp:.3,rs:1.0,sz:.85},
  {t:"jupiter",a0:Math.PI,sp:.3,rs:1.0,sz:1.4},
  {t:"saturno",a0:Math.PI*1.5,sp:.3,rs:1.0,sz:1.1}
];
// cada planeta é um ponto de luz com a cor dele
const GLOW={terra:"80,170,255",marte:"255,110,70",jupiter:"255,190,110",saturno:"255,225,150"};
function drawPlanet(c,t,x,y,r){
  const col=GLOW[t]||"255,255,255",tw=.85+.15*Math.sin(performance.now()/400+x);
  c.save();c.globalCompositeOperation="lighter";
  const h=c.createRadialGradient(x,y,0,x,y,r*3.2);
  h.addColorStop(0,`rgba(${col},${.9*tw})`);h.addColorStop(.25,`rgba(${col},${.45*tw})`);h.addColorStop(1,`rgba(${col},0)`);
  c.fillStyle=h;c.beginPath();c.arc(x,y,r*3.2,0,6.283);c.fill();
  const k=c.createRadialGradient(x,y,0,x,y,r*.9);k.addColorStop(0,"rgba(255,255,255,1)");k.addColorStop(.6,`rgba(${col},.95)`);k.addColorStop(1,`rgba(${col},0)`);
  c.fillStyle=k;c.beginPath();c.arc(x,y,r*.9,0,6.283);c.fill();
  c.restore();
}
/* assinatura "UNIVERSE": letra fina e espaçada, prata-azulada, com linhas douradas e estrelinhas nas pontas */
function drawWordmark(c,cx,y,size,alpha){
  const txt="UNIVERSE",sp=size*.7;
  c.save();c.globalAlpha*=alpha;c.font=`300 ${size}px Outfit, "Helvetica Neue", sans-serif`;c.textBaseline="middle";c.textAlign="left";
  const ws=[...txt].map(ch=>c.measureText(ch).width),total=ws.reduce((a,b)=>a+b,0)+sp*(txt.length-1);
  let x=cx-total/2;const x0=x,x1=x+total;
  const g=c.createLinearGradient(x0,0,x1,0);g.addColorStop(0,"#9fc2ff");g.addColorStop(.5,"#ffffff");g.addColorStop(1,"#9fc2ff");
  c.fillStyle=g;c.shadowColor="rgba(80,150,255,.85)";c.shadowBlur=size*.6;
  [...txt].forEach((ch,k)=>{c.fillText(ch,x,y);x+=ws[k]+sp});
  c.shadowBlur=0;
  const gap=size*1.1,L=size*3.4,lw=Math.max(1,size*.06);
  [[x0-gap,-1],[x1+gap,1]].forEach(([px,dir])=>{
    const lg=c.createLinearGradient(px,0,px+dir*L,0);lg.addColorStop(0,"rgba(255,214,107,.9)");lg.addColorStop(1,"rgba(255,214,107,0)");
    c.fillStyle=lg;c.fillRect(Math.min(px,px+dir*L),y-lw/2,L,lw);
    const r=size*.26;c.fillStyle="#ffe49a";c.shadowColor="rgba(255,200,80,.9)";c.shadowBlur=size*.5;
    c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;c.lineTo(px+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill();c.shadowBlur=0;
  });

/* explosão de confete e estrelas */
function starRain(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("confetti"),cx=cv.getContext("2d"),W=cv.width=innerWidth,H=cv.height=innerHeight;
  const cols=["#ffd66b","#ffe8a3","#ffffff","#5f9bff","#9b8cff","#4fd6c8","#ff8fb1","#ffb938"];
  const star=(r)=>{cx.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4-Math.PI/2,rr=k%2?r*.3:r;cx.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}cx.closePath();cx.fill()};
  const origins=[[W/2,H*.4,0],[0,H*.75,1],[W,H*.75,-1]];
  const ps=Array.from({length:n},(_,k)=>{const [ox,oy,dir]=origins[k%3];
    const vx=dir?dir*(6+Math.random()*10):(Math.random()-.5)*16,vy=dir?-(10+Math.random()*12):-(Math.random()*15+5);
    return{x:ox,y:oy,vx,vy,s:Math.random()*6+4,r:Math.random()*6,vr:(Math.random()-.5)*.35,c:rnd(cols),kind:Math.random()<.3?"star":"paper",fl:Math.random()*6}});
  let t=0;(function fr(){
    cx.clearRect(0,0,W,H);t++;
    ps.forEach(p=>{p.vy+=.32;p.vx*=.985;p.vy*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.fl+=.25;
      cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;
      if(p.kind==="star"){cx.shadowColor=p.c;cx.shadowBlur=8;star(p.s)}
      else{cx.scale(1,Math.cos(p.fl));cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2)}
      cx.restore()});
    if(t<260)requestAnimationFrame(fr);else cx.clearRect(0,0,W,H);
  })();
}

const inClaude=typeof window.claude!=="undefined"&&!!window.claude&&typeof window.claude.use==="function";
let supaMode=false;
async function supaLoad(){
  try{
    const r=await fetch(`${SUPA.url}/rest/v1/ranking?select=nome,pontos,total,criado_em&order=pontos.desc,criado_em.asc&limit=500`,{headers:{apikey:SUPA.key}});
    if(!r.ok)throw new Error(r.status);
    const data=await r.json(),best=new Map();
    // cada nome aparece uma vez, com a melhor nota
    data.forEach(d=>{const k=String(d.nome||"").trim().toLowerCase();if(!k)return;if(!best.has(k))best.set(k,{id:k,nome:d.nome,pontos:d.pontos,total:d.total})});
    rows=[...best.values()].sort((a,b)=>b.pontos-a.pontos);
    note("rankNote","");renderRank();
  }catch(e){if(!rows.length)note("rankNote","Não deu pra carregar o ranking agora. Abre a página de novo.")}
}

  try{

      rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.pontos-a.pontos||a.em-b.em);

    dust.forEach(d=>{const sn=Math.sin(d.a);if((sn>=0)!==front)return;c.fillStyle=`rgba(255,226,150,${.4+.5*Math.abs(sn)})`;c.beginPath();c.arc(Math.cos(d.a)*RX*d.r,sn*RY*d.r,d.z,0,6.283);c.fill()});
    ORBIT.forEach(p=>{const a=p.a0+.9,sn=Math.sin(a);if((sn>=0)!==front)return;drawPlanet(c,p.t,Math.cos(a)*RX*p.rs,sn*RY*p.rs,R*.03*p.sz*(1+.25*sn))});
    c.restore()};
  ringHalf(false);
  c.save();c.font=`300 ${F}px Outfit, "Helvetica Neue", sans-serif`;c.textBaseline="alphabetic";
  const w="Thı",m=c.measureText(w),asc=m.actualBoundingBoxAscent||F*.72,desc=m.actualBoundingBoxDescent||0,x0=lx-m.width/2,base=ly+(asc+desc)/2-desc+F*.02;
  const wTh=c.measureText("Th").width,wI=c.measureText("ı").width,xH=c.measureText("x").actualBoundingBoxAscent||F*.5,sx=x0+wTh+wI/2,sr=F*.11,sy=base-xH-F*.17;
  const g=c.createLinearGradient(0,base-asc,0,base);g.addColorStop(0,"#fffbe8");g.addColorStop(.38,"#ffd66b");g.addColorStop(.52,"#b8741a");g.addColorStop(.62,"#ffcf5a");g.addColorStop(1,"#fff1b8");
  c.shadowColor="rgba(255,190,60,.5)";c.shadowBlur=36*sc*.6;c.fillStyle=g;c.fillText(w,x0,base);
  const star=(r)=>{c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4-Math.PI/2,rr=i%2?r*.28:r;c.lineTo(sx+Math.cos(a)*rr,sy+Math.sin(a)*rr)}c.closePath()};
  star(sr);c.fill();
  // brilho da estrela no pingo do i
  c.globalCompositeOperation="lighter";c.shadowBlur=0;
  const hg=c.createRadialGradient(sx,sy,0,sx,sy,sr*3.2);hg.addColorStop(0,"rgba(255,240,190,.8)");hg.addColorStop(.3,"rgba(255,200,80,.3)");hg.addColorStop(1,"rgba(255,190,60,0)");
  c.fillStyle=hg;c.beginPath();c.arc(sx,sy,sr*3.2,0,6.283);c.fill();
  c.fillStyle="rgba(255,250,225,.95)";star(sr*1.15);c.fill();
  c.fillStyle="rgba(255,245,210,.75)";c.fillRect(sx-sr*2.6,sy-1.2,sr*5.2,2.4);c.fillRect(sx-1.2,sy-sr*2,2.4,sr*4);
  c.restore();
  ringHalf(true);
  drawWordmark(c,W/2,ly+R*.72,42,1);
  // painel do resultado
  const px=90,py=680,pw=W-180,ph=980,rr=56;
  c.save();c.beginPath();c.roundRect?c.roundRect(px,py,pw,ph,rr):c.rect(px,py,pw,ph);c.fillStyle="rgba(10,18,52,.72)";c.fill();c.lineWidth=2;c.strokeStyle="rgba(150,180,255,.28)";c.stroke();c.restore();
  c.textAlign="center";
  c.fillStyle="#9fb0dc";c.font="900 34px Nunito, sans-serif";c.fillText("QUANTO VOCÊ CONHECE O THI?",W/2,py+100);
  c.fillStyle="#eef3ff";c.font="600 76px Outfit, sans-serif";
  let nm=nome;while(c.measureText(nm).width>pw-120&&nm.length>3)nm=nm.slice(0,-1);if(nm!==nome)nm+="…";c.fillText(nm,W/2,py+205);
  c.save();c.font="300 300px Outfit, sans-serif";c.fillStyle="#ffd66b";c.shadowColor="rgba(255,190,60,.6)";c.shadowBlur=50;
  const sTxt=String(pts),tTxt="/"+QS.length,sw=c.measureText(sTxt).width;c.font="300 130px Outfit, sans-serif";const tw=c.measureText(tTxt).width;
  const sx0=W/2-(sw+tw)/2;c.textAlign="left";c.font="300 300px Outfit, sans-serif";c.fillText(sTxt,sx0,py+500);

}
// abre a folha de compartilhar do celular com a imagem (Instagram, Salvar imagem, etc.)
async function shareImage(){
  if(!cardBlob)return "no";
  let file;try{file=new File([cardBlob],"thi-universe.png",{type:"image/png"})}catch(e){return "no"}
  if(navigator.canShare&&navigator.share&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return "ok"}catch(e){return e&&e.name==="AbortError"?"cancel":"no"}
  }
  return "no";
}
function tip(id,html){$(id).innerHTML=html;$(id).hidden=!html}
async function saveCard(){
  if(!cardBlob)return;
  if(dl){ // dentro do Claude
    try{await dl.save({filename:"resultado-thi-universe.png",data:cardBlob});$("sSave").textContent="Salvo!";setTimeout(()=>$("sSave").textContent="Salvar",1800);return}
    catch(e){if(e&&e.code==="declined")return}
  }
  const r=await shareImage();
  if(r==="ok"||r==="cancel"){if(r==="ok")tip("saveTip","");return}
  // computador ou navegador sem compartilhar: baixa o arquivo
  try{const u=URL.createObjectURL(cardBlob),a=document.createElement("a");a.href=u;a.download="resultado-thi-universe.png";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}catch(e){}
  tip("saveTip","Se não salvou, segura o dedo na imagem e toca em <b>Salvar</b>.");
}
$("sSave").onclick=()=>{tip("saveTip",/iPhone|iPad|Android/i.test(navigator.userAgent)?"Na janela que abrir, toca em <b>Salvar imagem</b>.":"");saveCard()};
$("sIg").addEventListener("click",async e=>{
  e.preventDefault();
  tip("igTip","Na janela que abrir, escolhe o <b>Instagram</b> e depois <b>Stories</b>.");
  const r=await shareImage();
  if(r==="ok"||r==="cancel")return;
  // sem compartilhar com imagem (ex.: computador): salva e abre o Instagram
  await saveCard();
  tip("igTip","Imagem salva! Agora posta nos stories marcando o Thi.");
  window.open("https://www.instagram.com/","_blank","noopener");
});

$("go").onclick=start;
$("nome").addEventListener("keydown",e=>{if(e.key==="Enter")start()});
$("next").onclick=next;
$("seeRank").onclick=()=>$("rank").scrollIntoView({behavior:"smooth",block:"start"});
